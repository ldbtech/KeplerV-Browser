<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><style>text{dominant-baseline:auto}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0c12"/><stop offset=".58" stop-color="#11131c"/><stop offset="1" stop-color="#151324"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b2a2ff"/><stop offset="1" stop-color="#856cff"/></linearGradient><radialGradient id="glow"><stop stop-color="#7055dc" stop-opacity=".22"/><stop offset="1" stop-color="#7055dc" stop-opacity="0"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#bg)"/><circle cx="1540" cy="190" r="520" fill="url(#glow)"/><circle cx="190" cy="890" r="430" fill="url(#glow)"/><rect x="44" y="32" width="1832" height="1010" rx="27" fill="#10121a" stroke="#30323d" opacity="1.0"/><path d="M44 111 H1876" stroke="#2d2f3a"/><g transform="translate(83 58)" fill="none" stroke="#a38fff" stroke-width="3"><ellipse cx="19" cy="17" rx="19" ry="8"/><ellipse cx="19" cy="17" rx="19" ry="8" transform="rotate(60 19 17)"/><ellipse cx="19" cy="17" rx="19" ry="8" transform="rotate(120 19 17)"/><circle cx="19" cy="17" r="3.5" fill="#a38fff"/></g><text x="127" y="78" fill="#f5f3ff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" opacity="1.0" letter-spacing="0">keplerv</text><text x="783" y="77" fill="#aaa9bc" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" opacity="1.0" letter-spacing="1.8">PRESENT</text><rect x="1486" y="51" width="318" height="34" rx="17" fill="#28253d" stroke="#28253d" opacity="1.0"/><text x="1502" y="74" fill="#c4b6ff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">ILLUSTRATED TOUR · 06</text><rect x="66" y="132" width="248" height="878" rx="22" fill="#12141d" stroke="#272a36" opacity="1.0"/><text x="94" y="176" fill="#8c8fa2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" opacity="1.0" letter-spacing="2">YOUR SPACE</text><circle cx="103" cy="205" r="6" fill="#717488"/><text x="123" y="211" fill="#a3a5b7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">My goals</text><circle cx="103" cy="267" r="6" fill="#717488"/><text x="123" y="273" fill="#a3a5b7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">Helpers</text><circle cx="103" cy="329" r="6" fill="#717488"/><text x="123" y="335" fill="#a3a5b7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">Recent activity</text><rect x="80" y="367" width="218" height="48" rx="13" fill="#29263d" stroke="#38324f" opacity="1.0"/><circle cx="103" cy="391" r="6" fill="#b1a0ff"/><text x="123" y="397" fill="#eceafb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" opacity="1.0" letter-spacing="0">Safety</text><circle cx="103" cy="453" r="6" fill="#717488"/><text x="123" y="459" fill="#a3a5b7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">LLM providers</text><path d="M87 555 H291" stroke="#303240" stroke-width="1"/><rect x="85" y="886" width="206" height="52" rx="15" fill="url(#accent)" stroke="url(#accent)" opacity="1.0"/><text x="105" y="919" fill="#11111a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" opacity="1.0" letter-spacing="0">+ New goal</text><text x="92" y="965" fill="#9698aa" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" opacity="1.0" letter-spacing="0">Accessibility &amp; settings</text><text x="363" y="160" fill="#9295a8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" opacity="1.0" letter-spacing="1.4">WORKSPACE  /  GUARD AND AIP</text><text x="363" y="228" fill="#f5f3ff" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" opacity="1.0" letter-spacing="0">Guard makes policy decisions reviewable.</text><text x="365" y="267" fill="#a7a8ba" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" opacity="1.0" letter-spacing="0">A blocked action can create a case with decision evidence and status.</text><rect x="363" y="314" width="936" height="509" rx="22" fill="#171923" stroke="#303240" opacity="1.0"/><rect x="397" y="344" width="190" height="34" rx="17" fill="#29253d" stroke="#29253d" opacity="1.0"/><text x="413" y="367" fill="#c0b2ff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">SAFETY WORKSPACE</text><text x="397" y="420" fill="#f4f2ff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" opacity="1.0" letter-spacing="0">No active cases in this staging profile</text><text x="397" y="457" fill="#a4a5b8" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="397" dy="0">When AIP blocks a routed agent action, Guard can retain the</tspan><tspan x="397" dy="24">decision, reason, evidence and review status here.</tspan></text><rect x="397" y="537" width="258" height="189" rx="19" fill="#181a25" stroke="#303342" opacity="1.0"/><rect x="397" y="537" width="5" height="189" rx="2" fill="#ff9b9b"/><rect x="419" y="555" width="88" height="34" rx="17" fill="#29253d" stroke="#29253d" opacity="1.0"/><text x="435" y="578" fill="#ff9b9b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">01</text><text x="421" y="623" fill="#f4f2ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" opacity="1.0" letter-spacing="0">Decision</text><text x="421" y="658" fill="#a8a9bb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400"><tspan x="421" dy="0">Allowed / blocked</tspan><tspan x="421" dy="25">Policy reason</tspan></text><rect x="671" y="537" width="258" height="189" rx="19" fill="#181a25" stroke="#303342" opacity="1.0"/><rect x="671" y="537" width="5" height="189" rx="2" fill="#ffbd7d"/><rect x="693" y="555" width="88" height="34" rx="17" fill="#29253d" stroke="#29253d" opacity="1.0"/><text x="709" y="578" fill="#ffbd7d" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">02</text><text x="695" y="623" fill="#f4f2ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" opacity="1.0" letter-spacing="0">Evidence</text><text x="695" y="658" fill="#a8a9bb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400"><tspan x="695" dy="0">Action summary</tspan><tspan x="695" dy="25">Relevant runtime record</tspan></text><rect x="945" y="537" width="315" height="189" rx="19" fill="#181a25" stroke="#303342" opacity="1.0"/><rect x="945" y="537" width="5" height="189" rx="2" fill="#93e0c5"/><rect x="967" y="555" width="88" height="34" rx="17" fill="#29253d" stroke="#29253d" opacity="1.0"/><text x="983" y="578" fill="#93e0c5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">03</text><text x="969" y="623" fill="#f4f2ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" opacity="1.0" letter-spacing="0">Response</text><text x="969" y="658" fill="#a8a9bb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400"><tspan x="969" dy="0">Review or undo</tspan><tspan x="969" dy="25">Pause-only default</tspan></text><rect x="1332" y="314" width="472" height="509" rx="22" fill="#1a1b28" stroke="#3a3c4b" opacity="1.0"/><text x="1367" y="370" fill="#f5f3ff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" opacity="1.0" letter-spacing="0">What Guard covers</text><text x="1367" y="410" fill="#b1b2c2" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="1367" dy="0">Policy-gated tools and</tspan><tspan x="1367" dy="24">actions routed through</tspan><tspan x="1367" dy="24">KeplerV&#x27;s AIP layer.</tspan></text><path d="M1367 503 H1766" stroke="#303240" stroke-width="1"/><text x="1367" y="546" fill="#f4f2ff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" opacity="1.0" letter-spacing="0">What Guard cannot promise</text><text x="1367" y="585" fill="#a3a5b6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400"><tspan x="1367" dy="0">It is not an all-seeing</tspan><tspan x="1367" dy="23">monitor and cannot guarantee</tspan><tspan x="1367" dy="23">detection of novel attacks.</tspan></text><rect x="1367" y="699" width="288" height="34" rx="17" fill="#302b25" stroke="#302b25" opacity="1.0"/><text x="1383" y="722" fill="#ffd397" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">ILLUSTRATIVE FLOW · NO INCIDENT</text><text x="365" y="932" fill="#999bae" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">Guard records real policy events; this illustrated panel is not a real block or incident.</text><rect x="350" y="1016" width="1490" height="1" rx="0" fill="#333440" stroke="#333440" opacity="1.0"/><text x="363" y="1038" fill="#77798d" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" opacity="1.0" letter-spacing="0.7">KEPLERV  ·  INTENT-FIRST BROWSING WITH USER-CONTROLLED AGENTS</text></svg>