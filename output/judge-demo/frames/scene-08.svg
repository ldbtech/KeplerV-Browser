<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><style>text{dominant-baseline:auto}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0c12"/><stop offset=".58" stop-color="#11131c"/><stop offset="1" stop-color="#151324"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b2a2ff"/><stop offset="1" stop-color="#856cff"/></linearGradient><radialGradient id="glow"><stop stop-color="#7055dc" stop-opacity=".22"/><stop offset="1" stop-color="#7055dc" stop-opacity="0"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#bg)"/><circle cx="1540" cy="190" r="520" fill="url(#glow)"/><circle cx="190" cy="890" r="430" fill="url(#glow)"/><rect x="44" y="32" width="1832" height="1010" rx="27" fill="#10121a" stroke="#30323d" opacity="1.0"/><path d="M44 111 H1876" stroke="#2d2f3a"/><g transform="translate(83 58)" fill="none" stroke="#a38fff" stroke-width="3"><ellipse cx="19" cy="17" rx="19" ry="8"/><ellipse cx="19" cy="17" rx="19" ry="8" transform="rotate(60 19 17)"/><ellipse cx="19" cy="17" rx="19" ry="8" transform="rotate(120 19 17)"/><circle cx="19" cy="17" r="3.5" fill="#a38fff"/></g><text x="127" y="78" fill="#f5f3ff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" opacity="1.0" letter-spacing="0">keplerv</text><text x="783" y="77" fill="#aaa9bc" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" opacity="1.0" letter-spacing="1.8">PRESENT</text><rect x="1486" y="51" width="318" height="34" rx="17" fill="#28253d" stroke="#28253d" opacity="1.0"/><text x="1502" y="74" fill="#c4b6ff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">ILLUSTRATED TOUR · 08</text><rect x="66" y="132" width="248" height="878" rx="22" fill="#12141d" stroke="#272a36" opacity="1.0"/><text x="94" y="176" fill="#8c8fa2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" opacity="1.0" letter-spacing="2">YOUR SPACE</text><circle cx="103" cy="205" r="6" fill="#717488"/><text x="123" y="211" fill="#a3a5b7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">My goals</text><circle cx="103" cy="267" r="6" fill="#717488"/><text x="123" y="273" fill="#a3a5b7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">Helpers</text><circle cx="103" cy="329" r="6" fill="#717488"/><text x="123" y="335" fill="#a3a5b7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">Recent activity</text><circle cx="103" cy="391" r="6" fill="#717488"/><text x="123" y="397" fill="#a3a5b7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">Safety</text><rect x="80" y="429" width="218" height="48" rx="13" fill="#29263d" stroke="#38324f" opacity="1.0"/><circle cx="103" cy="453" r="6" fill="#b1a0ff"/><text x="123" y="459" fill="#eceafb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" opacity="1.0" letter-spacing="0">LLM providers</text><path d="M87 555 H291" stroke="#303240" stroke-width="1"/><rect x="85" y="886" width="206" height="52" rx="15" fill="url(#accent)" stroke="url(#accent)" opacity="1.0"/><text x="105" y="919" fill="#11111a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" opacity="1.0" letter-spacing="0">+ New goal</text><text x="92" y="965" fill="#9698aa" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" opacity="1.0" letter-spacing="0">Accessibility &amp; settings</text><text x="363" y="160" fill="#9295a8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" opacity="1.0" letter-spacing="1.4">WORKSPACE  /  PRIVACY AND USAGE CONTROLS</text><text x="363" y="228" fill="#f5f3ff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" opacity="1.0" letter-spacing="0">See the data path before a run.</text><text x="365" y="267" fill="#a7a8ba" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" opacity="1.0" letter-spacing="0">Provider, endpoint, context and limits are visible for the selected goal.</text><rect x="363" y="314" width="885" height="522" rx="22" fill="#171923" stroke="#303240" opacity="1.0"/><text x="399" y="367" fill="#f4f2ff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" opacity="1.0" letter-spacing="0">Provider for this goal</text><rect x="399" y="389" width="258" height="34" rx="17" fill="#302b25" stroke="#302b25" opacity="1.0"/><text x="415" y="412" fill="#ffd397" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">CONFIGURED · CONSENT OFF</text><text x="399" y="468" fill="#f0eefb" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" opacity="1.0" letter-spacing="0">Context that would be sent</text><circle cx="410" cy="505" r="6" fill="#aa96ff"/><text x="429" y="511" fill="#c7c5d5" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">Goal and related tasks</text><circle cx="410" cy="542" r="6" fill="#aa96ff"/><text x="429" y="548" fill="#c7c5d5" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">Starting page, if supplied</text><circle cx="410" cy="579" r="6" fill="#aa96ff"/><text x="429" y="585" fill="#c7c5d5" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">Selected public page excerpts</text><path d="M399 620 H1200" stroke="#303240" stroke-width="1"/><text x="399" y="661" fill="#e0deed" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" opacity="1.0" letter-spacing="0">Token ceiling</text><text x="1010" y="661" fill="#b0b2c2" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" opacity="1.0" letter-spacing="0">1,000–50,000 tokens / run</text><text x="399" y="711" fill="#a4a5b7" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400"><tspan x="399" dy="0">A token cap is a usage limit, not a dollar estimate.</tspan><tspan x="399" dy="21">The provider controls its own retention.</tspan></text><rect x="1292" y="314" width="512" height="522" rx="22" fill="#1a1b28" stroke="#3a3c4b" opacity="1.0"/><text x="1327" y="367" fill="#f5f3ff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" opacity="1.0" letter-spacing="0">Local privacy controls</text><rect x="1327" y="401" width="440" height="115" rx="19" fill="#181a25" stroke="#303342" opacity="1.0"/><rect x="1327" y="401" width="5" height="115" rx="2" fill="#9f8bff"/><text x="1351" y="443" fill="#f4f2ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" opacity="1.0" letter-spacing="0">Local endpoint</text><text x="1351" y="478" fill="#a8a9bb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400"><tspan x="1351" dy="0">Data stays on this Mac only when</tspan><tspan x="1351" dy="25">the configured endpoint is local.</tspan></text><rect x="1327" y="534" width="440" height="115" rx="19" fill="#181a25" stroke="#303342" opacity="1.0"/><rect x="1327" y="534" width="5" height="115" rx="2" fill="#70d7c4"/><text x="1351" y="576" fill="#f4f2ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" opacity="1.0" letter-spacing="0">Keychain</text><text x="1351" y="611" fill="#a8a9bb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400"><tspan x="1351" dy="0">OAuth secrets stay in macOS Keychain;</tspan><tspan x="1351" dy="25">tokens are bridged to the runtime.</tspan></text><rect x="1327" y="667" width="440" height="115" rx="19" fill="#181a25" stroke="#303342" opacity="1.0"/><rect x="1327" y="667" width="5" height="115" rx="2" fill="#ffbf78"/><text x="1351" y="709" fill="#f4f2ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" opacity="1.0" letter-spacing="0">History controls</text><text x="1351" y="744" fill="#a8a9bb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400"><tspan x="1351" dy="0">Export a workspace backup or delete</tspan><tspan x="1351" dy="25">local runtime history from settings.</tspan></text><text x="365" y="932" fill="#999bae" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">Consent is per goal and provider. Switching provider or endpoint requires fresh consent.</text><rect x="350" y="1016" width="1490" height="1" rx="0" fill="#333440" stroke="#333440" opacity="1.0"/><text x="363" y="1038" fill="#77798d" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" opacity="1.0" letter-spacing="0.7">KEPLERV  ·  INTENT-FIRST BROWSING WITH USER-CONTROLLED AGENTS</text></svg>