ans-serif" font-size="12" font-weight="700" opacity="1.0" letter-spacing="2">YOUR SPACE</text><rect x="80" y="181" width="218" height="48" rx="13" fill="#29263d" stroke="#38324f" opacity="1.0"/><circle cx="103" cy="205" r="6" fill="#b1a0ff"/><text x="123" y="211" fill="#eceafb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" opacity="1.0" letter-spacing="0">My goals</text><circle cx="103" cy="267" r="6" fill="#717488"/><text x="123" y="273" fill="#a3a5b7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">Helpers</text><circle cx="103" cy="329" r="6" fill="#717488"/><text x="123" y="335" fill="#a3a5b7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">Recent activity</text><circle cx="103" cy="391" r="6" fill="#717488"/><text x="123" y="397" fill="#a3a5b7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">Safety</text><circle cx="103" cy="453" r="6" fill="#717488"/><text x="123" y="459" fill="#a3a5b7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">LLM providers</text><path d="M87 555 H291" stroke="#303240" stroke-width="1"/><rect x="85" y="886" width="206" height="52" rx="15" fill="url(#accent)" stroke="url(#accent)" opacity="1.0"/><text x="105" y="919" fill="#11111a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" opacity="1.0" letter-spacing="0">+ New goal</text><text x="92" y="965" fill="#9698aa" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" opacity="1.0" letter-spacing="0">Accessibility &amp; settings</text><text x="363" y="160" fill="#9295a8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" opacity="1.0" letter-spacing="1.4">WORKSPACE  /  RESEARCH WITH CONSENT</text><text x="363" y="228" fill="#f5f3ff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" opacity="1.0" letter-spacing="0">Research with a clear boundary.</text><text x="365" y="268" fill="#a7a8ba" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" opacity="1.0" letter-spacing="0">A goal can collect source-linked findings after you approve its research context.</text><rect x="364" y="310" width="888" height="572" rx="22" fill="#151721" stroke="#2d2f3d" opacity="1.0"/><rect x="397" y="342" width="140" height="34" rx="17" fill="#29253d" stroke="#29253d" opacity="1.0"/><text x="413" y="365" fill="#c0b3ff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">ACTIVE GOAL</text><text x="399" y="423" fill="#f4f2ff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" opacity="1.0" letter-spacing="0">Understand coastal resilience</text><text x="399" y="460" fill="#a9aabc" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400"><tspan x="399" dy="0">Compare public research and identify practical</tspan><tspan x="399" dy="26">adaptation strategies for the North Shore.</tspan></text><rect x="398" y="538" width="370" height="250" rx="19" fill="#181a25" stroke="#303342" opacity="1.0"/><rect x="398" y="538" width="5" height="250" rx="2" fill="#9f8bff"/><rect x="420" y="556" width="99" height="34" rx="17" fill="#29253d" stroke="#29253d" opacity="1.0"/><text x="436" y="579" fill="#9f8bff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">3 STEPS</text><text x="422" y="624" fill="#f4f2ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" opacity="1.0" letter-spacing="0">Related tasks</text><text x="422" y="659" fill="#a8a9bb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400"><tspan x="422" dy="0">Clarify the next step</tspan><tspan x="422" dy="25">Collect useful evidence</tspan><tspan x="422" dy="25">Review the outcome</tspan></text><rect x="790" y="538" width="423" height="250" rx="19" fill="#181a25" stroke="#303342" opacity="1.0"/><rect x="790" y="538" width="5" height="250" rx="2" fill="#9f8bff"/><rect x="812" y="556" width="88" height="34" rx="17" fill="#29253d" stroke="#29253d" opacity="1.0"/><text x="828" y="579" fill="#9f8bff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">LOCAL</text><text x="814" y="624" fill="#f4f2ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" opacity="1.0" letter-spacing="0">Assigned helper</text><text x="814" y="659" fill="#a8a9bb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400"><tspan x="814" dy="0">Researcher</tspan><tspan x="814" dy="25">Runs on this device</tspan></text><rect x="1290" y="310" width="514" height="572" rx="22" fill="#1a1b28" stroke="#4b4268" opacity="1.0"/><text x="1323" y="360" fill="#f4f2ff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" opacity="1.0" letter-spacing="0">Research with Muse</text><text x="1323" y="399" fill="#a8a9bb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400"><tspan x="1323" dy="0">Search across public sites, compare</tspan><tspan x="1323" dy="23">evidence, then save quotes and links.</tspan></text><text x="1323" y="493" fill="#aeb0c1" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" opacity="1.0" letter-spacing="1">MAXIMUM TOKEN BUDGET</text><rect x="1323" y="511" width="443" height="54" rx="12" fill="#11131c" stroke="#3b3d4d" opacity="1.0"/><text x="1340" y="546" fill="#f1efff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" opacity="1.0" letter-spacing="0">5,000 tokens per run</text><text x="1323" y="605" fill="#aeb0c1" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" opacity="1.0" letter-spacing="1">PROVIDER CONTEXT CONSENT</text><rect x="1323" y="624" width="21" height="21" rx="5" fill="#151721" stroke="#89849e" opacity="1.0"/><text x="1355" y="641" fill="#c8c5d6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" opacity="1.0" letter-spacing="0">Off until you approve</text><text x="1323" y="690" fill="#9698aa" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400"><tspan x="1323" dy="0">The goal, starting link and selected</tspan><tspan x="1323" dy="21">public excerpts go to the chosen</tspan><tspan x="1323" dy="21">provider only after consent.</tspan></text><rect x="1323" y="788" width="443" height="52" rx="15" fill="#212330" stroke="#393b4b" opacity="1.0"/><text x="1343" y="821" fill="#e8e6f6" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" opacity="1.0" letter-spacing="0">Research with Muse</text><text x="365" y="932" fill="#999bae" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">This example uses real public links selected for the tour; no live research run or provider call occurred.</text><rect x="350" y="1016" width="1490" height="1" rx="0" fill="#333440" stroke="#333440" opacity="1.0"/><text x="363" y="1038" fill="#77798d" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" opacity="1.0" letter-spacing="0.7">KEPLERV  ·  INTENT-FIRST BROWSING WITH USER-CONTROLLED AGENTS</text></svg>