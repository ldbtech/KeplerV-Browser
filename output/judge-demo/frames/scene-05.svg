<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><style>text{dominant-baseline:auto}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0c12"/><stop offset=".58" stop-color="#11131c"/><stop offset="1" stop-color="#151324"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b2a2ff"/><stop offset="1" stop-color="#856cff"/></linearGradient><radialGradient id="glow"><stop stop-color="#7055dc" stop-opacity=".22"/><stop offset="1" stop-color="#7055dc" stop-opacity="0"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#bg)"/><circle cx="1540" cy="190" r="520" fill="url(#glow)"/><circle cx="190" cy="890" r="430" fill="url(#glow)"/><rect x="44" y="32" width="1832" height="1010" rx="27" fill="#10121a" stroke="#30323d" opacity="1.0"/><path d="M44 111 H1876" stroke="#2d2f3a"/><g transform="translate(83 58)" fill="none" stroke="#a38fff" stroke-width="3"><ellipse cx="19" cy="17" rx="19" ry="8"/><ellipse cx="19" cy="17" rx="19" ry="8" transform="rotate(60 19 17)"/><ellipse cx="19" cy="17" rx="19" ry="8" transform="rotate(120 19 17)"/><circle cx="19" cy="17" r="3.5" fill="#a38fff"/></g><text x="127" y="78" fill="#f5f3ff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" opacity="1.0" letter-spacing="0">keplerv</text><text x="783" y="77" fill="#aaa9bc" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" opacity="1.0" letter-spacing="1.8">PRESENT</text><rect x="1486" y="51" width="318" height="34" rx="17" fill="#28253d" stroke="#28253d" opacity="1.0"/><text x="1502" y="74" fill="#c4b6ff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">ILLUSTRATED TOUR · 05</text><rect x="66" y="132" width="248" height="878" rx="22" fill="#12141d" stroke="#272a36" opacity="1.0"/><text x="94" y="176" fill="#8c8fa2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" opacity="1.0" letter-spacing="2">YOUR SPACE</text><circle cx="103" cy="205" r="6" fill="#717488"/><text x="123" y="211" fill="#a3a5b7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">My goals</text><rect x="80" y="243" width="218" height="48" rx="13" fill="#29263d" stroke="#38324f" opacity="1.0"/><circle cx="103" cy="267" r="6" fill="#b1a0ff"/><text x="123" y="273" fill="#eceafb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" opacity="1.0" letter-spacing="0">Helpers</text><circle cx="103" cy="329" r="6" fill="#717488"/><text x="123" y="335" fill="#a3a5b7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">Recent activity</text><circle cx="103" cy="391" r="6" fill="#717488"/><text x="123" y="397" fill="#a3a5b7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">Safety</text><circle cx="103" cy="453" r="6" fill="#717488"/><text x="123" y="459" fill="#a3a5b7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">LLM providers</text><path d="M87 555 H291" stroke="#303240" stroke-width="1"/><rect x="85" y="886" width="206" height="52" rx="15" fill="url(#accent)" stroke="url(#accent)" opacity="1.0"/><text x="105" y="919" fill="#11111a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" opacity="1.0" letter-spacing="0">+ New goal</text><text x="92" y="965" fill="#9698aa" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" opacity="1.0" letter-spacing="0">Accessibility &amp; settings</text><text x="363" y="160" fill="#9295a8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" opacity="1.0" letter-spacing="1.4">WORKSPACE  /  HELPERS AND CONNECTED SERVICES</text><text x="363" y="228" fill="#f5f3ff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" opacity="1.0" letter-spacing="0">Helpers and connected services.</text><text x="365" y="267" fill="#a7a8ba" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" opacity="1.0" letter-spacing="0">Keep routine research separate from actions that need your approval.</text><rect x="364" y="314" width="446" height="196" rx="19" fill="#181a25" stroke="#303342" opacity="1.0"/><rect x="364" y="314" width="5" height="196" rx="2" fill="#a48eff"/><rect x="386" y="332" width="88" height="34" rx="17" fill="#29253d" stroke="#29253d" opacity="1.0"/><text x="402" y="355" fill="#a48eff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">HELPER</text><text x="388" y="400" fill="#f4f2ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" opacity="1.0" letter-spacing="0">On-device Researcher</text><text x="388" y="435" fill="#a8a9bb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400"><tspan x="388" dy="0">Organizes public-source work</tspan><tspan x="388" dy="25">Can be assigned to a goal</tspan><tspan x="388" dy="25">Runs in the local workspace</tspan></text><rect x="364" y="534" width="446" height="255" rx="19" fill="#181a25" stroke="#303342" opacity="1.0"/><rect x="364" y="534" width="5" height="255" rx="2" fill="#74d3c4"/><rect x="386" y="552" width="99" height="34" rx="17" fill="#29253d" stroke="#29253d" opacity="1.0"/><text x="402" y="575" fill="#74d3c4" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">PHASE 5</text><text x="388" y="620" fill="#f4f2ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" opacity="1.0" letter-spacing="0">Connected services</text><text x="388" y="655" fill="#a8a9bb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400"><tspan x="388" dy="0">Gmail / Outlook OAuth</tspan><tspan x="388" dy="25">Your client ID and account are required</tspan><tspan x="388" dy="25">Scoped tokens stay out of frontend JS</tspan></text><rect x="852" y="314" width="951" height="475" rx="22" fill="#161822" stroke="#323441" opacity="1.0"/><rect x="886" y="344" width="298" height="34" rx="17" fill="#39272d" stroke="#39272d" opacity="1.0"/><text x="902" y="367" fill="#ffbdc4" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">SENSITIVE ACTION · EMAIL SEND</text><text x="888" y="426" fill="#f4f2ff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" opacity="1.0" letter-spacing="0">Review before anything is sent</text><text x="888" y="480" fill="#9e9fb2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" opacity="1.0" letter-spacing="1">TO</text><rect x="888" y="495" width="857" height="44" rx="10" fill="#11131c" stroke="#383a48" opacity="1.0"/><text x="906" y="524" fill="#d4d2e2" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" opacity="1.0" letter-spacing="0">recipient shown for your review</text><text x="888" y="564" fill="#9e9fb2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" opacity="1.0" letter-spacing="1">SUBJECT + MESSAGE PREVIEW</text><rect x="888" y="581" width="857" height="83" rx="10" fill="#11131c" stroke="#383a48" opacity="1.0"/><text x="906" y="610" fill="#aaaabb" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400"><tspan x="906" dy="0">Draft content appears here before sending.</tspan><tspan x="906" dy="23">Provider and account scope are shown with the request.</tspan></text><rect x="888" y="700" width="205" height="34" rx="17" fill="#28253d" stroke="#28253d" opacity="1.0"/><text x="904" y="723" fill="#c0b4ff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">AIP GRANT REQUIRED</text><rect x="1105" y="700" width="253" height="34" rx="17" fill="#39272d" stroke="#39272d" opacity="1.0"/><text x="1121" y="723" fill="#ffc0c5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">HUMAN APPROVAL REQUIRED</text><rect x="888" y="742" width="220" height="52" rx="15" fill="#212330" stroke="#393b4b" opacity="1.0"/><text x="908" y="775" fill="#e8e6f6" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" opacity="1.0" letter-spacing="0">Approve send</text><text x="365" y="932" fill="#999bae" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" opacity="1.0" letter-spacing="0">Live email requires OAuth setup, an AIP grant and your per-send review. Disconnected calls fail closed; no mail was sent in this tour.</text><rect x="350" y="1016" width="1490" height="1" rx="0" fill="#333440" stroke="#333440" opacity="1.0"/><text x="363" y="1038" fill="#77798d" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" opacity="1.0" letter-spacing="0.7">KEPLERV  ·  INTENT-FIRST BROWSING WITH USER-CONTROLLED AGENTS</text></svg>