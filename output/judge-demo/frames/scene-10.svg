ans-serif" font-size="12" font-weight="700" opacity="1.0" letter-spacing="2">YOUR SPACE</text><rect x="80" y="181" width="218" height="48" rx="13" fill="#29263d" stroke="#38324f" opacity="1.0"/><circle cx="103" cy="205" r="6" fill="#b1a0ff"/><text x="123" y="211" fill="#eceafb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" opacity="1.0" letter-spacing="0">My goals</text><circle cx="103" cy="267" r="6" fill="#717488"/><text x="123" y="273" fill="#a3a5b7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">Helpers</text><circle cx="103" cy="329" r="6" fill="#717488"/><text x="123" y="335" fill="#a3a5b7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">Recent activity</text><circle cx="103" cy="391" r="6" fill="#717488"/><text x="123" y="397" fill="#a3a5b7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">Safety</text><circle cx="103" cy="453" r="6" fill="#717488"/><text x="123" y="459" fill="#a3a5b7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">LLM providers</text><path d="M87 555 H291" stroke="#303240" stroke-width="1"/><rect x="85" y="886" width="206" height="52" rx="15" fill="url(#accent)" stroke="url(#accent)" opacity="1.0"/><text x="105" y="919" fill="#11111a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" opacity="1.0" letter-spacing="0">+ New goal</text><text x="92" y="965" fill="#9698aa" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" opacity="1.0" letter-spacing="0">Accessibility &amp; settings</text><text x="363" y="160" fill="#9295a8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" opacity="1.0" letter-spacing="1.4">WORKSPACE  /  KEPLERV PRODUCT TOUR</text><text x="363" y="228" fill="#f5f3ff" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" opacity="1.0" letter-spacing="0">One workspace for the whole learning loop.</text><text x="365" y="267" fill="#a7a8ba" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" opacity="1.0" letter-spacing="0">KeplerV connects intent, research, media and action under visible user controls.</text><rect x="363" y="314" width="1441" height="414" rx="24" fill="#151721" stroke="#343342" opacity="1.0"/><circle cx="1081" cy="523" r="146" fill="#211f32" stroke="#6a5b9a" stroke-width="2"/><circle cx="1081" cy="523" r="90" fill="#302856" stroke="#9a84f0" stroke-width="2"/><circle cx="1081" cy="523" r="26" fill="url(#accent)"/><ellipse cx="1081" cy="523" rx="460" ry="142" fill="none" stroke="#403c51" stroke-width="2"/><ellipse cx="1081" cy="523" rx="320" ry="100" fill="none" stroke="#51486e" stroke-width="2"/><circle cx="620" cy="523" r="12" fill="#a795ff"/><circle cx="1541" cy="523" r="12" fill="#7edbc9"/><circle cx="1081" cy="380" r="12" fill="#87bbff"/><circle cx="1081" cy="665" r="12" fill="#ffbf78"/><text x="497" y="516" fill="#e2ddff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" opacity="1.0" letter-spacing="1">GOAL</text><text x="1570" y="516" fill="#c7f4e8" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" opacity="1.0" letter-spacing="1">LEARN</text><text x="1038" y="357" fill="#cee0ff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="1">RESEARCH</text><text x="1027" y="704" fill="#ffe4be" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="1">REVIEW</text><rect x="363" y="773" width="454" height="114" rx="19" fill="#181a25" stroke="#303342" opacity="1.0"/><rect x="363" y="773" width="5" height="114" rx="2" fill="#9f8bff"/><text x="387" y="815" fill="#f4f2ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" opacity="1.0" letter-spacing="0">Live features need setup</text><text x="387" y="850" fill="#a8a9bb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400"><tspan x="387" dy="0">Provider consent, OAuth sign-in or agent approval.</tspan></text><rect x="836" y="773" width="454" height="114" rx="19" fill="#181a25" stroke="#303342" opacity="1.0"/><rect x="836" y="773" width="5" height="114" rx="2" fill="#86c3ff"/><text x="860" y="815" fill="#f4f2ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" opacity="1.0" letter-spacing="0">This film is illustrated</text><text x="860" y="850" fill="#a8a9bb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400"><tspan x="860" dy="0">Curated source examples; no live agent or model call.</tspan></text><rect x="1308" y="773" width="496" height="114" rx="19" fill="#181a25" stroke="#303342" opacity="1.0"/><rect x="1308" y="773" width="5" height="114" rx="2" fill="#8de0c6"/><text x="1332" y="815" fill="#f4f2ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" opacity="1.0" letter-spacing="0">Continue the product</text><text x="1332" y="850" fill="#a8a9bb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400"><tspan x="1332" dy="0">Configure, approve, review, and keep control.</tspan></text><text x="363" y="932" fill="#c7b8ff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" opacity="1.0" letter-spacing="0">KeplerV  ·  Make the goal the starting point.</text><rect x="350" y="1016" width="1490" height="1" rx="0" fill="#333440" stroke="#333440" opacity="1.0"/><text x="363" y="1038" fill="#77798d" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" opacity="1.0" letter-spacing="0.7">KEPLERV  ·  INTENT-FIRST BROWSING WITH USER-CONTROLLED AGENTS</text></svg>