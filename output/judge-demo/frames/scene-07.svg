<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><style>text{dominant-baseline:auto}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0c12"/><stop offset=".58" stop-color="#11131c"/><stop offset="1" stop-color="#151324"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b2a2ff"/><stop offset="1" stop-color="#856cff"/></linearGradient><radialGradient id="glow"><stop stop-color="#7055dc" stop-opacity=".22"/><stop offset="1" stop-color="#7055dc" stop-opacity="0"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#bg)"/><circle cx="1540" cy="190" r="520" fill="url(#glow)"/><circle cx="190" cy="890" r="430" fill="url(#glow)"/><rect x="44" y="32" width="1832" height="1010" rx="27" fill="#10121a" stroke="#30323d" opacity="1.0"/><path d="M44 111 H1876" stroke="#2d2f3a"/><g transform="translate(83 58)" fill="none" stroke="#a38fff" stroke-width="3"><ellipse cx="19" cy="17" rx="19" ry="8"/><ellipse cx="19" cy="17" rx="19" ry="8" transform="rotate(60 19 17)"/><ellipse cx="19" cy="17" rx="19" ry="8" transform="rotate(120 19 17)"/><circle cx="19" cy="17" r="3.5" fill="#a38fff"/></g><text x="127" y="78" fill="#f5f3ff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" opacity="1.0" letter-spacing="0">keplerv</text><text x="783" y="77" fill="#aaa9bc" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" opacity="1.0" letter-spacing="1.8">PRESENT</text><rect x="1486" y="51" width="318" height="34" rx="17" fill="#28253d" stroke="#28253d" opacity="1.0"/><text x="1502" y="74" fill="#c4b6ff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">ILLUSTRATED TOUR · 07</text><rect x="66" y="132" width="248" height="878" rx="22" fill="#12141d" stroke="#272a36" opacity="1.0"/><text x="94" y="176" fill="#8c8fa2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" opacity="1.0" letter-spacing="2">YOUR SPACE</text><rect x="80" y="181" width="218" height="48" rx="13" fill="#29263d" stroke="#38324f" opacity="1.0"/><circle cx="103" cy="205" r="6" fill="#b1a0ff"/><text x="123" y="211" fill="#eceafb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" opacity="1.0" letter-spacing="0">My goals</text><circle cx="103" cy="267" r="6" fill="#717488"/><text x="123" y="273" fill="#a3a5b7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">Helpers</text><circle cx="103" cy="329" r="6" fill="#717488"/><text x="123" y="335" fill="#a3a5b7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">Recent activity</text><circle cx="103" cy="391" r="6" fill="#717488"/><text x="123" y="397" fill="#a3a5b7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">Safety</text><circle cx="103" cy="453" r="6" fill="#717488"/><text x="123" y="459" fill="#a3a5b7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">LLM providers</text><path d="M87 555 H291" stroke="#303240" stroke-width="1"/><rect x="85" y="886" width="206" height="52" rx="15" fill="url(#accent)" stroke="url(#accent)" opacity="1.0"/><text x="105" y="919" fill="#11111a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" opacity="1.0" letter-spacing="0">+ New goal</text><text x="92" y="965" fill="#9698aa" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" opacity="1.0" letter-spacing="0">Accessibility &amp; settings</text><text x="363" y="160" fill="#9295a8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" opacity="1.0" letter-spacing="1.4">WORKSPACE  /  PUBLIC AGENTS WITH APPROVAL</text><text x="363" y="228" fill="#f5f3ff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" opacity="1.0" letter-spacing="0">Outside agents are opt-in and approval-gated.</text><text x="365" y="267" fill="#a7a8ba" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" opacity="1.0" letter-spacing="0">Phase Six connects to a public A2A endpoint only after you review each step.</text><rect x="363" y="314" width="930" height="523" rx="22" fill="#171923" stroke="#303240" opacity="1.0"/><rect x="397" y="344" width="224" height="34" rx="17" fill="#29253d" stroke="#29253d" opacity="1.0"/><text x="413" y="367" fill="#c0b2ff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">PUBLIC A2A · PER GOAL</text><text x="397" y="416" fill="#f4f2ff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" opacity="1.0" letter-spacing="0">Allow this goal to contact external agents</text><rect x="397" y="443" width="24" height="24" rx="6" fill="#a58eff" stroke="#a58eff" opacity="1.0"/><path d="M403 455 L409 461 L418 449" fill="none" stroke="#14131d" stroke-width="2.5"/><text x="435" y="461" fill="#dfddec" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" opacity="1.0" letter-spacing="0">Opt in for this goal only</text><text x="397" y="511" fill="#9e9fb2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" opacity="1.0" letter-spacing="1">AGENT CARD URL</text><rect x="397" y="528" width="858" height="55" rx="11" fill="#11131c" stroke="#383a48" opacity="1.0"/><text x="416" y="563" fill="#a7a8ba" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" opacity="1.0" letter-spacing="0">https://public-agent.example/.well-known/agent-card.json</text><text x="397" y="626" fill="#9e9fb2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" opacity="1.0" letter-spacing="1">DESTINATION + MESSAGE PREVIEW</text><rect x="397" y="643" width="858" height="102" rx="11" fill="#11131c" stroke="#383a48" opacity="1.0"/><text x="416" y="675" fill="#b4b5c5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400"><tspan x="416" dy="0">Exact endpoint and outbound text are shown here.</tspan><tspan x="416" dy="24">You approve the session and each message separately.</tspan></text><rect x="397" y="765" width="222" height="52" rx="15" fill="#212330" stroke="#393b4b" opacity="1.0"/><text x="417" y="798" fill="#e8e6f6" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" opacity="1.0" letter-spacing="0">Review request</text><rect x="1327" y="314" width="477" height="523" rx="22" fill="#1a1b28" stroke="#4b4268" opacity="1.0"/><text x="1361" y="371" fill="#f5f3ff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" opacity="1.0" letter-spacing="0">Trust Gateway</text><text x="1361" y="411" fill="#aeb0c0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400"><tspan x="1361" dy="0">HTTPS destination checks</tspan><tspan x="1361" dy="32">No private-network targets</tspan><tspan x="1361" dy="32">Rate and message budgets</tspan><tspan x="1361" dy="32">Transcript per session</tspan></text><rect x="1361" y="573" width="271" height="34" rx="17" fill="#39272d" stroke="#39272d" opacity="1.0"/><text x="1377" y="596" fill="#ffc0c5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">REPLY = UNTRUSTED INPUT</text><text x="1361" y="648" fill="#cdcadb" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" opacity="1.0" letter-spacing="0">Public, unauthenticated A2A agents only</text><text x="1361" y="684" fill="#9fa1b2" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400"><tspan x="1361" dy="0">No universal directory. OAuth / API-key</tspan><tspan x="1361" dy="22">agent onboarding and file-part transport</tspan><tspan x="1361" dy="22">are not supported yet.</tspan></text><rect x="1361" y="779" width="339" height="34" rx="17" fill="#2c2638" stroke="#2c2638" opacity="1.0"/><text x="1377" y="802" fill="#c7b8ff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">NO OUTBOUND CONTACT IN THIS VIDEO</text><text x="365" y="932" fill="#999bae" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" opacity="1.0" letter-spacing="0">An A2A endpoint is not proof of identity. Agent trust tiers are self-asserted unless independently established.</text><rect x="350" y="1016" width="1490" height="1" rx="0" fill="#333440" stroke="#333440" opacity="1.0"/><text x="363" y="1038" fill="#77798d" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" opacity="1.0" letter-spacing="0.7">KEPLERV  ·  INTENT-FIRST BROWSING WITH USER-CONTROLLED AGENTS</text></svg>