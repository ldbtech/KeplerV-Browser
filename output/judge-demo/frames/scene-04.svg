Arial, Helvetica, sans-serif" font-size="42" font-weight="700" opacity="1.0" letter-spacing="0">A learning library tied to the goal.</text><text x="365" y="267" fill="#a7a8ba" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" opacity="1.0" letter-spacing="0">Videos, documents and web pages stay together for review.</text><rect x="365" y="303" width="123" height="34" rx="17" fill="#29253d" stroke="#29253d" opacity="1.0"/><text x="381" y="326" fill="#c0b2ff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">VIDEOS  1</text><rect x="500" y="303" width="158" height="34" rx="17" fill="#222331" stroke="#222331" opacity="1.0"/><text x="516" y="326" fill="#afb0c1" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">DOCUMENTS  1</text><rect x="670" y="303" width="146" height="34" rx="17" fill="#222331" stroke="#222331" opacity="1.0"/><text x="686" y="326" fill="#afb0c1" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">WEB PAGES  2</text><rect x="363" y="356" width="892" height="500" rx="22" fill="#171923" stroke="#303240" opacity="1.0"/><rect x="386" y="380" width="846" height="253" rx="18" fill="#25243a" stroke="#38344f" opacity="1.0"/><circle cx="808" cy="506" r="44" fill="#8c70ec" opacity=".94"/><path d="M798 482 L798 530 L833 506 Z" fill="#14131d"/><rect x="410" y="399" width="226" height="34" rx="17" fill="#332c4a" stroke="#332c4a" opacity="1.0"/><text x="426" y="422" fill="#d1c7ff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">OFFICIAL VIDEO PLAYLIST</text><text x="410" y="682" fill="#f5f3ff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" opacity="1.0" letter-spacing="0">Warming Up to Adaptation</text><text x="410" y="717" fill="#a4a5b9" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">National Park Service · opens at YouTube</text><rect x="410" y="765" width="192" height="52" rx="15" fill="url(#accent)" stroke="url(#accent)" opacity="1.0"/><text x="430" y="798" fill="#11111a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" opacity="1.0" letter-spacing="0">Open video</text><rect x="1285" y="356" width="519" height="236" rx="19" fill="#181a25" stroke="#303342" opacity="1.0"/><rect x="1285" y="356" width="5" height="236" rx="2" fill="#85a9ff"/><rect x="1307" y="374" width="88" height="34" rx="17" fill="#29253d" stroke="#29253d" opacity="1.0"/><text x="1323" y="397" fill="#85a9ff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">PDF</text><text x="1309" y="442" fill="#f4f2ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" opacity="1.0" letter-spacing="0">NOAA five-step guide</text><text x="1309" y="477" fill="#a8a9bb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400"><tspan x="1309" dy="0">PDF document</tspan><tspan x="1309" dy="25">Open in the library or at the source.</tspan><tspan x="1309" dy="25">Remote sites may restrict embedding.</tspan></text><rect x="1285" y="618" width="519" height="238" rx="19" fill="#181a25" stroke="#303342" opacity="1.0"/><rect x="1285" y="618" width="5" height="238" rx="2" fill="#8de0c6"/><rect x="1307" y="636" width="99" height="34" rx="17" fill="#29253d" stroke="#29253d" opacity="1.0"/><text x="1323" y="659" fill="#8de0c6" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">ARTICLE</text><text x="1309" y="704" fill="#f4f2ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" opacity="1.0" letter-spacing="0">Coastal adaptation guide</text><text x="1309" y="739" fill="#a8a9bb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400"><tspan x="1309" dy="0">Web resource</tspan><tspan x="1309" dy="25">Saved to this research goal.</tspan><tspan x="1309" dy="25">Open the source whenever you need it.</tspan></text><text x="365" y="932" fill="#999bae" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" opacity="1.0" letter-spacing="0">YouTube / Vimeo use provider-supported embeds. DRM services such as Netflix open externally; KeplerV does not bypass DRM.</text><rect x="350" y="1016" width="1490" height="1" rx="0" fill="#333440" stroke="#333440" opacity="1.0"/><text x="363" y="1038" fill="#77798d" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" opacity="1.0" letter-spacing="0.7">KEPLERV  ·  INTENT-FIRST BROWSING WITH USER-CONTROLLED AGENTS</text></svg>