<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><style>text{dominant-baseline:auto}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0c12"/><stop offset=".58" stop-color="#11131c"/><stop offset="1" stop-color="#151324"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b2a2ff"/><stop offset="1" stop-color="#856cff"/></linearGradient><radialGradient id="glow"><stop stop-color="#7055dc" stop-opacity=".22"/><stop offset="1" stop-color="#7055dc" stop-opacity="0"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#bg)"/><circle cx="1540" cy="190" r="520" fill="url(#glow)"/><circle cx="190" cy="890" r="430" fill="url(#glow)"/><rect x="44" y="32" width="1832" height="1010" rx="27" fill="#10121a" stroke="#30323d" opacity="1.0"/><path d="M44 111 H1876" stroke="#2d2f3a"/><g transform="translate(83 58)" fill="none" stroke="#a38fff" stroke-width="3"><ellipse cx="19" cy="17" rx="19" ry="8"/><ellipse cx="19" cy="17" rx="19" ry="8" transform="rotate(60 19 17)"/><ellipse cx="19" cy="17" rx="19" ry="8" transform="rotate(120 19 17)"/><circle cx="19" cy="17" r="3.5" fill="#a38fff"/></g><text x="127" y="78" fill="#f5f3ff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" opacity="1.0" letter-spacing="0">keplerv</text><text x="783" y="77" fill="#aaa9bc" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" opacity="1.0" letter-spacing="1.8">PRESENT</text><rect x="1486" y="51" width="318" height="34" rx="17" fill="#28253d" stroke="#28253d" opacity="1.0"/><text x="1502" y="74" fill="#c4b6ff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">ILLUSTRATED TOUR · 09</text><rect x="66" y="132" width="248" height="878" rx="22" fill="#12141d" stroke="#272a36" opacity="1.0"/><text x="94" y="176" fill="#8c8fa2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" opacity="1.0" letter-spacing="2">YOUR SPACE</text><rect x="80" y="181" width="218" height="48" rx="13" fill="#29263d" stroke="#38324f" opacity="1.0"/><circle cx="103" cy="205" r="6" fill="#b1a0ff"/><text x="123" y="211" fill="#eceafb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" opacity="1.0" letter-spacing="0">My goals</text><circle cx="103" cy="267" r="6" fill="#717488"/><text x="123" y="273" fill="#a3a5b7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">Helpers</text><circle cx="103" cy="329" r="6" fill="#717488"/><text x="123" y="335" fill="#a3a5b7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">Recent activity</text><circle cx="103" cy="391" r="6" fill="#717488"/><text x="123" y="397" fill="#a3a5b7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">Safety</text><circle cx="103" cy="453" r="6" fill="#717488"/><text x="123" y="459" fill="#a3a5b7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">LLM providers</text><path d="M87 555 H291" stroke="#303240" stroke-width="1"/><rect x="85" y="886" width="206" height="52" rx="15" fill="url(#accent)" stroke="url(#accent)" opacity="1.0"/><text x="105" y="919" fill="#11111a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" opacity="1.0" letter-spacing="0">+ New goal</text><text x="92" y="965" fill="#9698aa" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" opacity="1.0" letter-spacing="0">Accessibility &amp; settings</text><text x="363" y="160" fill="#9295a8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" opacity="1.0" letter-spacing="1.4">WORKSPACE  /  IMPORT AND EXPORT</text><text x="363" y="228" fill="#f5f3ff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" opacity="1.0" letter-spacing="0">Switching in and out is supported.</text><text x="365" y="267" fill="#a7a8ba" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" opacity="1.0" letter-spacing="0">Bring bookmarks in and keep a portable copy of your workspace.</text><rect x="363" y="326" width="436" height="249" rx="19" fill="#181a25" stroke="#303342" opacity="1.0"/><rect x="363" y="326" width="5" height="249" rx="2" fill="#86c3ff"/><rect x="385" y="344" width="99" height="34" rx="17" fill="#29253d" stroke="#29253d" opacity="1.0"/><text x="401" y="367" fill="#86c3ff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">MOVE IN</text><text x="387" y="412" fill="#f4f2ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" opacity="1.0" letter-spacing="0">Import bookmarks</text><text x="387" y="447" fill="#a8a9bb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400"><tspan x="387" dy="0">Browser bookmarks HTML</tspan><tspan x="387" dy="25">Keep folder paths</tspan><tspan x="387" dy="25">Merge without duplicate URLs</tspan></text><rect x="827" y="326" width="436" height="249" rx="19" fill="#181a25" stroke="#303342" opacity="1.0"/><rect x="827" y="326" width="5" height="249" rx="2" fill="#8de0c6"/><rect x="849" y="344" width="110" height="34" rx="17" fill="#29253d" stroke="#29253d" opacity="1.0"/><text x="865" y="367" fill="#8de0c6" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">MOVE OUT</text><text x="851" y="412" fill="#f4f2ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" opacity="1.0" letter-spacing="0">Export bookmarks</text><text x="851" y="447" fill="#a8a9bb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400"><tspan x="851" dy="0">Standard HTML bookmark file</tspan><tspan x="851" dy="25">Carry bookmarks to another browser</tspan><tspan x="851" dy="25">Keep titles and folders</tspan></text><rect x="1290" y="326" width="514" height="249" rx="19" fill="#181a25" stroke="#303342" opacity="1.0"/><rect x="1290" y="326" width="5" height="249" rx="2" fill="#a48eff"/><rect x="1312" y="344" width="165" height="34" rx="17" fill="#29253d" stroke="#29253d" opacity="1.0"/><text x="1328" y="367" fill="#a48eff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">PORTABLE COPY</text><text x="1314" y="412" fill="#f4f2ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" opacity="1.0" letter-spacing="0">Workspace backup</text><text x="1314" y="447" fill="#a8a9bb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400"><tspan x="1314" dy="0">Goals, saved resources, and evidence</tspan><tspan x="1314" dy="25">Portable JSON with schema validation</tspan><tspan x="1314" dy="25">Use it for manual device transfer</tspan></text><rect x="363" y="620" width="1441" height="195" rx="21" fill="#171923" stroke="#303240" opacity="1.0"/><text x="397" y="674" fill="#f4f2ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" opacity="1.0" letter-spacing="0">Today&#x27;s continuity</text><text x="397" y="720" fill="#b7b5c8" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" opacity="1.0" letter-spacing="0">Bookmarks + local workspace backup</text><path d="M826 708 H1190" stroke="#51486e" stroke-width="2" stroke-dasharray="7 8"/><circle cx="851" cy="708" r="11" fill="#a48eff"/><circle cx="1172" cy="708" r="11" fill="#7f8194"/><text x="1212" y="702" fill="#dad8e7" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" opacity="1.0" letter-spacing="0">Cloud profile sync</text><rect x="1212" y="722" width="259" height="34" rx="17" fill="#302b25" stroke="#302b25" opacity="1.0"/><text x="1228" y="745" fill="#ffd397" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" opacity="1.0" letter-spacing="0.4">NOT AVAILABLE IN THIS BUILD</text><text x="365" y="932" fill="#999bae" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" opacity="1.0" letter-spacing="0">Bookmark import/export is the migration path today. Cross-device profile sync is not implemented.</text><rect x="350" y="1016" width="1490" height="1" rx="0" fill="#333440" stroke="#333440" opacity="1.0"/><text x="363" y="1038" fill="#77798d" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" opacity="1.0" letter-spacing="0.7">KEPLERV  ·  INTENT-FIRST BROWSING WITH USER-CONTROLLED AGENTS</text></svg>